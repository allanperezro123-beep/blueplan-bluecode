  <!-- Líneas horizontales paralelas en el centro (3 fases) -->
  <line x1="28" y1="38" x2="72" y2="38" stroke="black" stroke-width="2.5" />
  <line x1="28" y1="50" x2="72" y2="50" stroke="black" stroke-width="2.5" />
  <line x1="28" y1="62" x2="72" y2="62" stroke="black" stroke-width="2.5" />
