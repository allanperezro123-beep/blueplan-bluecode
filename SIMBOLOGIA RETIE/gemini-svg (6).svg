<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Línea izquierda -->
  <line x1="10" y1="50" x2="35" y2="50" stroke="black" stroke-width="2.5" />
  <!-- Cuchilla/Interruptor abierto -->
  <line x1="35" y1="50" x2="65" y2="30" stroke="black" stroke-width="2.5" stroke-linecap="round" />
  <!-- Círculo de articulación -->
  <circle cx="68" cy="50" r="3.5" stroke="black" stroke-width="2" fill="none" />
  <!-- Línea derecha -->
  <line x1="72" y1="50" x2="90" y2="50" stroke="black" stroke-width="2.5" />
</svg>
